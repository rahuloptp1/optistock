<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#030712"/>
<title>OptiStock</title>
<script src="https://unpkg.com/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#030712;color:#fff;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none;min-height:100vh;}
input,select,textarea,button{font-family:inherit;font-size:14px;}
button{cursor:pointer;border:none;background:none;}
::-webkit-scrollbar{display:none;}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* Header */
.header{background:#111827;border-bottom:1px solid #1f2937;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;}
.header-left{display:flex;align-items:center;gap:8px;}
.header-title{font-size:16px;font-weight:700;line-height:1;}
.header-sub{font-size:11px;color:#6b7280;margin-top:2px;}
.header-badges{display:flex;gap:6px;align-items:center;}

/* Bottom Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#111827;border-top:1px solid #1f2937;display:flex;z-index:50;}
.nav-btn{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#4b5563;border:none;background:none;}
.nav-btn.active{color:#3b82f6;}
.nav-btn span:first-child{font-size:18px;}
.nav-btn span:last-child{font-size:9px;font-weight:500;}

/* Main */
.main{flex:1;overflow-y:auto;padding:16px;padding-bottom:96px;}

/* Cards */
.card{background:rgba(31,41,55,0.6);border:1px solid rgba(55,65,81,0.5);border-radius:16px;}
.card-p{padding:16px;}
.sect-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;}
.blue{color:#60a5fa;}.green{color:#34d399;}.amber{color:#fbbf24;}.purple{color:#c084fc;}.cyan{color:#22d3ee;}.red{color:#f87171;}

/* Form fields */
.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;color:#9ca3af;margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;background:rgba(55,65,81,0.6);border:1px solid #4b5563;border-radius:12px;padding:10px 12px;color:#fff;outline:none;font-size:14px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#3b82f6;}
.field input.err,.field select.err{border-color:#ef4444;}
.err-msg{font-size:11px;color:#f87171;margin-top:2px;}
.field textarea{resize:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Badges */
.badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid;display:inline-block;}
.badge-blue{background:rgba(30,58,138,0.5);color:#93c5fd;border-color:#1d4ed8;}
.badge-green{background:rgba(6,78,59,0.5);color:#6ee7b7;border-color:#065f46;}
.badge-yellow{background:rgba(120,53,15,0.5);color:#fde68a;border-color:#92400e;}
.badge-red{background:rgba(127,29,29,0.5);color:#fca5a5;border-color:#991b1b;}
.badge-purple{background:rgba(88,28,135,0.5);color:#e9d5ff;border-color:#6b21a8;}
.badge-orange{background:rgba(124,45,18,0.5);color:#fed7aa;border-color:#9a3412;}
.badge-cyan{background:rgba(8,51,68,0.5);color:#a5f3fc;border-color:#0e7490;}

/* Buttons */
.btn{padding:14px;border-radius:16px;font-weight:600;font-size:15px;width:100%;display:block;text-align:center;border:none;cursor:pointer;}
.btn-blue{background:#2563eb;color:#fff;}
.btn-blue:disabled{opacity:0.5;}
.btn-gray{background:rgba(55,65,81,1);color:#d1d5db;border:1px solid #4b5563;}
.btn-green{background:#059669;color:#fff;}
.btn-purple{background:#7c3aed;color:#fff;}
.btn-red{background:#dc2626;color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:10px;}
.flex-btns{display:flex;gap:12px;}
.flex-btns .btn{flex:1;}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-card{border-radius:16px;padding:16px;border:1px solid;}
.stat-blue{background:rgba(30,58,138,0.2);border-color:rgba(59,130,246,0.3);}
.stat-green{background:rgba(6,78,59,0.2);border-color:rgba(52,211,153,0.3);}
.stat-yellow{background:rgba(120,53,15,0.2);border-color:rgba(251,191,36,0.3);}
.stat-label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.05em;}
.stat-value{font-size:24px;font-weight:700;margin-top:4px;}
.stat-blue .stat-value{color:#60a5fa;}
.stat-green .stat-value{color:#34d399;}
.stat-yellow .stat-value{color:#fbbf24;}
.stat-sub{font-size:11px;color:#9ca3af;margin-top:2px;}

/* Alerts */
.alert{border-radius:16px;padding:12px;border:1px solid;margin-bottom:8px;}
.alert-red{background:rgba(127,29,29,0.3);border-color:rgba(153,27,27,0.5);}
.alert-amber{background:rgba(120,53,15,0.2);border-color:rgba(146,64,14,0.5);}
.alert-orange{background:rgba(124,45,18,0.2);border-color:rgba(154,52,18,0.5);}
.alert-msg{font-size:14px;font-weight:600;}
.alert-red .alert-msg{color:#f87171;}
.alert-amber .alert-msg{color:#fbbf24;}
.alert-orange .alert-msg{color:#fb923c;}

/* Photo upload */
.photo-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.photo-thumb{position:relative;width:80px;height:80px;border-radius:12px;overflow:hidden;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-del{position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.photo-add{position:relative;width:80px;height:80px;border:2px dashed #4b5563;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9ca3af;overflow:hidden;}
.photo-add span{font-size:24px;line-height:1;}
.photo-add small{font-size:11px;}
.photo-add input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.photo-hint{font-size:11px;color:#4b5563;margin-top:4px;}

/* Scan button */
.scan-btn{background:linear-gradient(135deg,#1d4ed8,#2563eb);border:1px solid rgba(59,130,246,0.4);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;margin-bottom:16px;}
.scan-icon{width:48px;height:48px;background:rgba(59,130,246,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.scan-title{font-size:16px;font-weight:700;color:#fff;}
.scan-sub{font-size:11px;color:#93c5fd;margin-top:2px;}
.scan-arrow{color:#93c5fd;font-size:20px;margin-left:auto;}

/* Product grid */
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.prod-card{background:rgba(31,41,55,0.6);border:1px solid rgba(55,65,81,0.5);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
.prod-img{aspect-ratio:1;background:rgba(55,65,81,0.5);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:0.2;}
.prod-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:1;}
.prod-stock-badge{position:absolute;top:8px;right:8px;border-radius:20px;padding:2px 6px;font-size:11px;font-weight:700;color:#fff;}
.stock-ok{background:rgba(5,150,105,0.8);}
.stock-low{background:rgba(180,83,9,0.8);}
.stock-out{background:rgba(185,28,28,0.8);}
.prod-type-badge{position:absolute;bottom:8px;left:8px;}
.prod-info{padding:12px;flex:1;display:flex;flex-direction:column;gap:4px;}
.prod-brand{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-sub{font-size:12px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-price{font-size:14px;font-weight:700;color:#34d399;margin-top:4px;}
.prod-variants{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px;}
.prod-var-tag{font-size:10px;background:rgba(55,65,81,0.5);color:#9ca3af;padding:2px 6px;border-radius:6px;}
.prod-actions{display:flex;gap:6px;margin-top:8px;}
.prod-actions button{flex:1;padding:6px;border-radius:10px;font-size:11px;font-weight:600;}
.btn-sell-sm{background:rgba(5,150,105,0.5);border:1px solid rgba(4,120,87,0.5);color:#fff;}
.btn-edit-sm{background:rgba(55,65,81,0.5);border:1px solid rgba(75,85,99,0.5);color:#d1d5db;}
.btn-del-sm{background:rgba(127,29,29,0.4);border:1px solid rgba(153,27,27,0.4);color:#f87171;padding:6px 8px;border-radius:10px;}

/* List view */
.prod-row{background:rgba(31,41,55,0.6);border:1px solid rgba(55,65,81,0.5);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;}
.prod-row-img{width:56px;height:56px;border-radius:12px;background:rgba(55,65,81,0.5);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0.2;position:relative;}
.prod-row-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:1;}
.prod-row-info{flex:1;min-width:0;}
.prod-row-actions{display:flex;flex-direction:column;gap:6px;}
.prod-row-actions button{padding:6px 10px;border-radius:10px;font-size:11px;}

/* Bar chart */
.bar-item{margin-bottom:10px;}
.bar-labels{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;}
.bar-label{color:#d1d5db;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;}
.bar-val{color:#9ca3af;}
.bar-track{height:6px;background:#374151;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 0.5s;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:#1f2937;border:1px solid #374151;border-radius:20px;padding:24px;width:100%;max-width:360px;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:4px;}
.modal p{font-size:14px;color:#9ca3af;margin-bottom:20px;}

/* Fullscreen */
.fullscreen{position:fixed;inset:0;background:#030712;z-index:50;display:flex;flex-direction:column;}
.fs-header{background:#111827;border-bottom:1px solid #1f2937;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.fs-back{font-size:24px;color:#9ca3af;line-height:1;background:none;border:none;cursor:pointer;}
.fs-body{flex:1;overflow-y:auto;padding:16px;}

/* Power grid */
.power-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.power-cell{border-radius:12px;padding:8px;border:1px solid;}
.power-cell-empty{border-color:rgba(55,65,81,0.5);background:rgba(55,65,81,0.2);}
.power-cell-filled{border-color:rgba(37,99,235,0.5);background:rgba(30,58,138,0.3);}
.power-cell label{font-size:11px;color:#9ca3af;display:block;margin-bottom:4px;}
.power-cell input{width:100%;background:transparent;border:none;color:#fff;font-size:14px;font-weight:700;outline:none;}

/* Colour variants */
.variant-row{display:flex;align-items:center;gap:8px;background:rgba(55,65,81,0.4);border-radius:12px;padding:10px;margin-bottom:8px;}
.variant-color{flex:1;font-size:14px;}
.variant-qty{width:60px;background:rgba(75,85,99,1);border:1px solid #6b7280;border-radius:8px;padding:6px 8px;color:#fff;text-align:center;font-size:14px;}
.variant-del{color:#f87171;font-size:14px;background:none;border:none;cursor:pointer;padding:0 4px;}

/* Type selector */
.type-btn{background:rgba(31,41,55,0.6);border:1px solid rgba(55,65,81,0.5);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;margin-bottom:8px;}
.type-btn:hover{border-color:rgba(59,130,246,0.5);}
.type-icon{font-size:32px;}
.type-label{font-size:16px;font-weight:600;}
.type-desc{font-size:12px;color:#9ca3af;margin-top:2px;}

/* Filter bar */
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.filter-grid select{background:#374151;border:1px solid #4b5563;border-radius:12px;padding:8px 12px;color:#fff;font-size:12px;width:100%;outline:none;}
.price-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.price-row input{flex:1;background:#374151;border:1px solid #4b5563;border-radius:12px;padding:8px 12px;color:#fff;font-size:12px;outline:none;}
.price-dash{color:#6b7280;}

/* Type pills */
.type-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;}
.type-pill{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid;cursor:pointer;}
.type-pill.active{background:#2563eb;border-color:#1d4ed8;color:#fff;}
.type-pill.inactive{background:#1f2937;border-color:#374151;color:#9ca3af;}

/* Colour picker for sale */
.colour-pills{display:flex;flex-wrap:wrap;gap:8px;}
.colour-pill{padding:8px 12px;border-radius:12px;font-size:13px;border:1px solid;cursor:pointer;}
.colour-pill.active{border-color:#3b82f6;background:rgba(30,58,138,0.5);color:#fff;}
.colour-pill.inactive{border-color:#374151;color:#d1d5db;}
.colour-pill.disabled{opacity:0.3;cursor:not-allowed;}

/* Search */
.search-row{display:flex;gap:8px;margin-bottom:12px;}
.search-input{flex:1;background:#1f2937;border:1px solid #374151;border-radius:12px;padding:10px 16px;color:#fff;font-size:14px;outline:none;}
.search-input::placeholder{color:#6b7280;}
.icon-btn{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:10px 12px;color:#9ca3af;position:relative;}

/* Sale summary box */
.sale-summary{background:rgba(6,78,59,0.2);border:1px solid rgba(4,120,87,0.5);border-radius:16px;padding:12px;}
.sale-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;}
.sale-row:last-child{margin-bottom:0;}

/* List items */
.list-tag{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;border:1px solid;font-size:13px;background:rgba(30,58,138,0.3);border-color:#1d4ed8;color:#93c5fd;display:inline-flex;margin:4px;}
.list-tag-x{color:#6b7280;cursor:pointer;font-size:11px;}

/* Margin box */
.margin-box{border-radius:12px;padding:10px 12px;font-size:13px;margin-top:4px;}
.margin-pos{background:rgba(6,78,59,0.2);border:1px solid rgba(4,120,87,0.5);color:#34d399;}
.margin-neg{background:rgba(127,29,29,0.2);border:1px solid rgba(153,27,27,0.5);color:#f87171;}

/* Empty state */
.empty{text-align:center;padding:80px 16px;}
.empty-icon{font-size:64px;margin-bottom:16px;}
.empty-title{font-size:18px;font-weight:600;margin-bottom:8px;}
.empty-sub{font-size:14px;color:#9ca3af;}

/* Plano badge */
.plano-badge{background:rgba(88,28,135,0.3);border:1px solid rgba(107,33,168,0.5);border-radius:12px;padding:8px 12px;font-size:12px;color:#c084fc;}

/* Gradient card */
.grad-card{background:linear-gradient(135deg,rgba(30,58,138,0.4),rgba(88,28,135,0.4));border:1px solid rgba(59,130,246,0.3);border-radius:16px;padding:16px;margin-bottom:16px;}

/* Scanning screen */
.scanning-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:24px;padding:32px;}
.scanning-icon{font-size:64px;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5};}

/* Notice */
.notice{font-size:11px;color:#4b5563;margin-top:8px;}
.notice-amber{color:#f59e0b;font-size:12px;background:rgba(120,53,15,0.2);border:1px solid rgba(146,64,14,0.4);border-radius:12px;padding:10px 12px;margin-top:8px;}

/* Section spacing */
.section{margin-bottom:16px;}
.back-btn{font-size:24px;color:#9ca3af;line-height:1;margin-bottom:16px;background:none;border:none;cursor:pointer;display:block;}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.page-sub{font-size:12px;color:#9ca3af;margin-bottom:16px;}

/* Deleted record */
.del-record{background:rgba(31,41,55,0.6);border:1px solid rgba(153,27,27,0.3);border-radius:16px;padding:16px;margin-bottom:12px;}
.warn-tag{font-size:11px;color:#f87171;font-weight:600;margin-top:6px;}

/* More menu */
.more-btn{background:rgba(31,41,55,0.6);border:1px solid rgba(55,65,81,0.5);border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;margin-bottom:8px;}
.more-icon{font-size:28px;}
.more-label{font-size:16px;font-weight:600;}
.more-sub{font-size:12px;color:#9ca3af;margin-top:2px;}

/* Flash */
.flash{background:rgba(6,78,59,0.3);border:1px solid rgba(4,120,87,0.5);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.flash-text{font-size:14px;font-weight:600;color:#34d399;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ═══════════════════════════════
// CONFIG
// ═══════════════════════════════
const CLOUD = "d1lg3bid3";
const PRESET = "opticalinventory";
const PIN = "1986";

// ═══════════════════════════════
// DB
// ═══════════════════════════════
const db = {
  get: k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};

// ═══════════════════════════════
// UTILS
// ═══════════════════════════════
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const fmt = n => "₹" + (n||0).toLocaleString("en-IN");
const today = () => new Date().toISOString().slice(0,10);
const daysSince = d => Math.floor((Date.now() - new Date(d||today()).getTime()) / 86400000);

const RX_POWERS = Array.from({length:21}, (_,i) => (-(1+i*0.25)).toFixed(2));
const RG_POWERS = ["+1.00","+1.25","+1.50","+1.75","+2.00","+2.25","+2.50","+2.75","+3.00"];
const SHAPES = ["Aviator","Round","Square","Rectangle","Cat Eye","Oval","Wayfarer","Clubmaster","Geometric","Rimless","Semi-Rimless"];
const MATERIALS = ["Acetate","Metal","Titanium","TR90","Fiber","Wood","Carbon Fiber","Mixed"];
const GENDERS = ["Men","Women","Kids","Unisex"];
const FRAME_CATS = ["Eyeglasses","Sunglasses","Sports","Reading Glasses","Kids","Safety"];
const COLORS = ["Black","Brown","Gold","Silver","Blue","Red","Green","Pink","Purple","Transparent","Tortoise","Multi"];
const LENS_COLORS = ["Brown","Grey","Blue","Green","Violet","Hazel","Turquoise","Honey","Aqua","Gemstone Green"];
const WEAR_SCHED = ["Daily","Monthly","Quarterly","Yearly","2-Weekly"];
const SUN_BRANDS = ["Fastrack","Generic"];
const LENS_BRANDS = ["Freshlook","Acuvue","Air Optix","SofLens","Bausch & Lomb","Cooper Vision","Generic"];
const ACC_TYPES = ["Specs Case","Selvet / Cleaning Cloth","Carry Bag","Lens Solution","Packaging Box","Other"];
const PROD_TYPES = [
  {id:"frame",label:"Eyeglasses / Frame",icon:"👓",desc:"Frames + Smart Temple Scan"},
  {id:"sunglasses",label:"Sunglasses",icon:"🕶️",desc:"Fastrack, Generic + Temple Scan"},
  {id:"rx_lens",label:"Rx Contact Lens",icon:"🔵",desc:"Power -1.00 to -6.00, stock per power"},
  {id:"colour_lens",label:"Colour Contact Lens",icon:"🌈",desc:"Plano colour lenses"},
  {id:"rg_lens",label:"Reading Glasses",icon:"👁️",desc:"Power +1.00 to +3.00"},
  {id:"accessory",label:"Accessory / Packaging",icon:"📦",desc:"Cases, selvets, bags, solution"},
];

function getStock(p) {
  if (p.type==="frame"||p.type==="sunglasses") {
    const t = (p.variants||[]).reduce((a,v)=>a+v.qty,0);
    return {total:t, label:`${t} pcs`, isLow:t>0&&t<=(p.reorderLevel||5), isOut:t===0};
  }
  if (p.type==="rx_lens"||p.type==="rg_lens") {
    const t = Object.values(p.stock||{}).reduce((a,v)=>a+v,0);
    const pw = Object.values(p.stock||{}).filter(v=>v>0).length;
    return {total:t, label:`${t} ${p.type==="rx_lens"?"boxes":"pcs"} · ${pw} powers`, isLow:t<=5, isOut:t===0};
  }
  const t = p.currentStock||0;

// ═══════════════════════════════
async function uploadPhoto(file) {
  // Save photo locally as base64 - no internet needed
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = () => reject(new Error("Could not read photo"));
    reader.readAsDataURL(file);
  });
}

// ═══════════════════════════════
// CLAUDE VISION
// ═══════════════════════════════
async function scanTemple(file) {
  try {
    const { data: { text } } = await Tesseract.recognize(file, "eng", {
      logger: m => console.log(m)
    });
    const raw = text.trim();
    console.log("Temple text:", raw);
    // Parse the text to extract fields
    const result = {brand:"",sku:"",size:"",material:"",color:"",collection:"",notes:raw,confidence:"medium"};
    // Size pattern: 52-18-145 or 52[]18-145 or 52x18-145
    const sizeMatch = raw.match(/\d{2}[\-\[\]□x\u25a1]\d{2}[\-\s]\d{3}/);
    if (sizeMatch) result.size = sizeMatch[0].replace(/[\[\]□\u25a1]/g,"-");
    // Model number - alphanumeric code like RB3025, F149, LP6002
    const modelMatch = raw.match(/[A-Z]{1,3}\s*[\-]?\s*\d{3,5}/);
    if (modelMatch) result.sku = modelMatch[0].replace(/\s/g,"");
    // Known brands
    const brands = ["RAY-BAN","RAYBAN","FASTRACK","TITAN","LENSKART","OAKLEY","POLICE","VOGUE","PRADA","GUCCI","TOMMY","NIKE","ADIDAS","SCOTT"];
    const upperText = raw.toUpperCase();
    for (const b of brands) {
      if (upperText.includes(b)) { result.brand = b.replace("-"," "); break; }
    }
    // Materials
    const mats = ["ACETATE","METAL","TITANIUM","TR90","NYLON","PLASTIC"];
    for (const m of mats) {
      if (upperText.includes(m)) { result.material = m.charAt(0)+m.slice(1).toLowerCase(); break; }
    }
    if (result.sku || result.size || result.brand) result.confidence = "high";
    return result;
  } catch(e) {
    console.error("Tesseract error:", e);
    return {brand:"",sku:"",size:"",material:"",color:"",collection:"",notes:"",confidence:"low"};
  }
}

function buildInventory() {

    const ms = !q || [p.brand,p.collection,p.name,p.lensColor,p.sku,p.accessoryType,...(p.tags||[])].some(v=>v?.toLowerCase().includes(q));
    const mt = state.inv_typeFilter==="all"||p.type===state.inv_typeFilter;
    const f = state.inv_filters;
    const mb = !f.brand||p.brand===f.brand;
    const msh = !f.shape||(p.shape||"")===f.shape;
    const mm = !f.material||(p.material||"")===f.material;
    const mg = !f.gender||(p.gender||"")===f.gender;
    const pr = p.sellingPrice||0;
    const mpn = !state.inv_pMin||pr>=parseFloat(state.inv_pMin);
    const mpx = !state.inv_pMax||pr<=parseFloat(state.inv_pMax);
    const si = getStock(p);
    let mst = true;
    if(f.status==="low") mst=si.isLow;
    if(f.status==="out") mst=si.isOut;
    if(f.status==="dead") {
      const ls=S.filter(s=>s.productId===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
      mst=si.total>0&&((!ls&&daysSince(p.purchaseDate||p.createdAt)>180)||(ls&&daysSince(ls.date)>180));
    }
    return ms&&mt&&mb&&msh&&mm&&mg&&mpn&&mpx&&mst;

// Helper field builders
function fieldInp(label, key, type="text", req=false) {
  return `<div class="field"><label>${label}${req?'<span style="color:#f87171;margin-left:2px">*</span>':""}</label><input type="${type}" value="${(formData[key]||"").toString().replace(/"/g,"&quot;")}" onchange="setFormField('${key}',this.value)" oninput="setFormField('${key}',this.value)"/></div>`;
}
function fieldSel(label, key, opts) {
  return `<div class="field"><label>${label}</label><select onchange="setFormField('${key}',this.value)"><option value="">Select...</option>${opts.map(o=>`<option value="${o}" ${formData[key]===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
}
function fieldCmb(label, key, opts, req=false) {
  const did = "dl_"+key+"_"+Math.random().toString(36).slice(2);
  return `<div class="field"><label>${label}${req?'<span style="color:#f87171;margin-left:2px">*</span>':""}</label><input list="${did}" value="${(formData[key]||"").toString().replace(/"/g,"&quot;")}" placeholder="Select or type..." onchange="setFormField('${key}',this.value)" oninput="setFormField('${key}',this.value)"/><datalist id="${did}">${opts.map(o=>`<option value="${o}"/>`).join("")}</datalist></div>`;
}
function fieldCmbCustom(label, key, opts, req=false) { return fieldCmb(label,key,opts,req); }

function buildAnalytics() {
  const P = state.products, S = state.sales;
  const totalRev = S.reduce((a,s)=>a+s.amount,0);
  const totalCost = S.reduce((a,s)=>{const p=P.find(x=>x.id===s.productId);return a+(p?.purchasePrice||0)*s.qty;},0);
  const totalSold = S.reduce((a,s)=>a+s.qty,0);
  const bm={},tm={},pm={},cm={},gm={},mm={};
  S.forEach(s=>{
    const p=P.find(x=>x.id===s.productId);if(!p)return;
    if(p.brand){bm[p.brand]=bm[p.brand]||{sold:0,rev:0};bm[p.brand].sold+=s.qty;bm[p.brand].rev+=s.amount;}
    const tl={frame:"Frames",sunglasses:"Sunglasses",rx_lens:"Rx Lens",colour_lens:"Colour Lens",rg_lens:"Reading Glasses",accessory:"Accessories"}[p.type]||p.type;
    tm[tl]=(tm[tl]||0)+s.qty;
    if((p.type==="rx_lens"||p.type==="rg_lens")&&s.power)pm[s.power]=(pm[s.power]||0)+s.qty;
    if(s.colour)cm[s.colour]=(cm[s.colour]||0)+s.qty;
    if(p.type==="colour_lens"&&p.lensColor)cm[p.lensColor]=(cm[p.lensColor]||0)+s.qty;
    if(p.gender)gm[p.gender]=(gm[p.gender]||0)+s.qty;
    if(p.material)mm[p.material]=(mm[p.material]||0)+s.qty;
  });
  const topBrands=Object.entries(bm).sort((a,b)=>b[1].rev-a[1].rev).slice(0,6);
  const topPowers=Object.entries(pm).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const topColours=Object.entries(cm).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const dead=P.filter(p=>{if(p.type==="accessory")return false;const si=getStock(p);if(si.total<=0)return false;const ls=S.filter(s=>s.productId===p.id).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];return(!ls&&daysSince(p.purchaseDate||p.createdAt)>180)||(ls&&daysSince(ls.date)>180);});

  return `
  <div class="page-title">Analytics</div>
  <div class="page-sub">Business intelligence</div>
  <div class="stat-grid section">
    <div class="stat-card stat-blue"><div class="stat-label">Revenue</div><div class="stat-value">${fmt(totalRev)}</div><div class="stat-sub">${totalSold} sold</div></div>
    <div class="stat-card stat-green"><div class="stat-label">Profit</div><div class="stat-value">${fmt(totalRev-totalCost)}</div><div class="stat-sub">${totalRev>0?((totalRev-totalCost)/totalRev*100).toFixed(1)+"% margin":""}</div></div>
  </div>
  ${S.length===0?`<div class="empty"><div class="empty-icon">📊</div><div class="empty-sub">Record sales to see analytics</div></div>`:""}
  ${Object.keys(tm).length?`<div class="card card-p section"><div class="sect-title cyan">📂 Sales by Category</div>${buildBar(Object.entries(tm).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v,d:`${v} sold`})),"#06b6d4")}</div>`:""}
  ${topBrands.length?`<div class="card card-p section"><div class="sect-title green">🏆 Top Brands</div>${topBrands.map(([br,d],i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(55,65,81,0.5)"><div style="display:flex;gap:8px;align-items:center"><span style="color:#4b5563;font-size:13px;width:16px">${i+1}</span><span style="font-size:14px">${br}</span></div><div style="text-align:right"><div style="font-size:14px;font-weight:700;color:#34d399">${fmt(d.rev)}</div><div style="font-size:11px;color:#9ca3af">${d.sold} sold</div></div></div>`).join("")}</div>`:""}
  ${Object.keys(gm).length?`<div class="card card-p section"><div class="sect-title" style="color:#f472b6">👥 Sales by Gender</div>${buildBar(Object.entries(gm).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v,d:`${v} sold`})),"#ec4899")}</div>`:""}
  ${Object.keys(mm).length?`<div class="card card-p section"><div class="sect-title amber">🔩 Material Trends</div>${buildBar(Object.entries(mm).sort((a,b)=>b[1]-a[1]).map(([l,v])=>({l,v,d:`${v} sold`})),"#f59e0b")}</div>`:""}
  ${topColours.length?`<div class="card card-p section"><div class="sect-title purple">🎨 Top Colours</div>${buildBar(topColours.map(([l,v])=>({l,v,d:`${v} sold`})),"#a855f7")}</div>`:""}
  ${topPowers.length?`<div class="card card-p section"><div class="sect-title blue">🔢 Top Powers</div>${buildBar(topPowers.map(([l,v])=>({l:`${l} SPH`,v,d:`${v} sold`})),"#3b82f6")}</div>`:""}
  ${dead.length?`<div style="background:rgba(124,45,18,0.15);border:1px solid rgba(154,52,18,0.4);border-radius:16px;padding:16px" class="section">
    <div style="font-size:14px;font-weight:600;color:#fb923c;margin-bottom:4px">💤 Dead Stock (6+ months) — ${dead.length} items</div>
    <div style="font-size:12px;color:#9ca3af;margin-bottom:12px">Locked capital: <span style="color:#fb923c">${fmt(dead.reduce((a,p)=>a+(p.purchasePrice||0)*getStock(p).total,0))}</span></div>
    ${dead.slice(0,6).map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(124,45,18,0.3)"><div><div style="font-size:14px">${p.brand} ${p.collection||p.name}</div><div style="font-size:11px;color:#9ca3af">${getStock(p).label}</div></div><span style="font-size:12px;color:#fb923c">${fmt((p.purchasePrice||0)*getStock(p).total)}</span></div>`).join("")}
  </div>`:""}
  <div style="font-size:12px;color:#4b5563;text-align:center;margin-top:16px">${S.length} sales · ${P.length} products</div>`;
}

function buildBar(data, color) {
  const mx = Math.max(...data.map(d=>d.v), 1);
  return data.map(d=>`
  <div class="bar-item">
    <div class="bar-labels"><span class="bar-label">${d.l}</span><span class="bar-val">${d.d||d.v}</span></div>

  </div>`).join("");
}

// Photo upload
async function handlePhotos(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  uploadingPhotos = true;
  // Show uploading state immediately
  const photoRow = document.getElementById("photo-row");
  if (photoRow) {
    const hint = photoRow.parentElement.querySelector(".photo-hint");
    if (hint) hint.textContent = "Uploading... please wait";
  }
  try {
    const urls = [];
    for (let i=0; i<files.length; i++) {
      const url = await uploadPhoto(files[i]);
      urls.push(url);
    }
    formData.images = [...(formData.images||[]), ...urls];
    uploadingPhotos = false;
    render();
    // Scroll to show the uploaded photo
    setTimeout(() => {
      const row = document.getElementById("photo-row");
      if (row) row.scrollIntoView({behavior:"smooth", block:"center"});
    }, 200);
  } catch(err) {
    uploadingPhotos = false;
    alert("Upload failed: " + err.message);
    render();
  }
}
function removePhoto(i) { formData.images = formData.images.filter((_,j)=>j!==i); render(); }

// Save functions
async function saveFrame() {
  const btn = document.getElementById("save-btn");
  if (btn) { btn.disabled=true; btn.textContent="Saving..."; }
  if (!formData.brand?.trim()) { alert("Brand is required"); if(btn){btn.disabled=false;btn.textContent=state.editing?"Update":"Save Frame";} return; }
  if (!formData.sellingPrice) { alert("Selling price is required"); if(btn){btn.disabled=false;btn.textContent=state.editing?"Update":"Save Frame";} return; }
  const total = formVariants.reduce((a,v)=>a+v.qty,0);
  const prod = {...formData, id:formData.id||uid(), type:state.addType,
    purchasePrice:parseFloat(formData.purchasePrice)||0, sellingPrice:parseFloat(formData.sellingPrice)||0,
    mrp:parseFloat(formData.mrp)||0, currentStock:total, reorderLevel:parseInt(formData.reorderLevel)||5,
    tags:formData.tags?formData.tags.split(",").map(t=>t.trim()).filter(Boolean):[],
    variants:[...formVariants], updatedAt:new Date().toISOString(), createdAt:formData.createdAt||new Date().toISOString()
  };
  updateCustomsFromProduct(prod);
  if (state.editing) state.products = state.products.map(p=>p.id===prod.id?prod:p);
  else state.products.push(prod);
  saveProducts();
  state.editing=null; state.addType=null; state.flashMsg="";
  goTab("inventory");
}

  if (!formData.brand?.trim()) { alert("Brand is required"); return; }

  const prod = {...formData, id:formData.id||uid(), type:state.addType,

    mrp:parseFloat(formData.mrp)||0, packSize:parseInt(formData.packSize)||1,
    tags:formData.tags?formData.tags.split(",").map(t=>t.trim()).filter(Boolean):[],
    stock:{...formStock}, updatedAt:new Date().toISOString(), createdAt:formData.createdAt||new Date().toISOString()
  };
  updateCustomsFromProduct(prod);
  if (state.editing) state.products = state.products.map(p=>p.id===prod.id?prod:p);
  else state.products.push(prod);
  saveProducts();
  state.editing=null; state.addType=null;
  goTab("inventory");
}

async function saveColour() {
  if (!formData.brand?.trim()) { alert("Brand is required"); return; }
  if (!formData.lensColor?.trim()) { alert("Lens colour is required"); return; }
  if (!formData.sellingPrice) { alert("Selling price is required"); return; }
  if (formData.currentStock===""||formData.currentStock===null) { alert("Current stock is required"); return; }
  const prod = {...formData, id:formData.id||uid(), type:"colour_lens",
    name:formData.name||`${formData.brand} ${formData.lensColor}`,
    purchasePrice:parseFloat(formData.purchasePrice)||0, sellingPrice:parseFloat(formData.sellingPrice)||0,
    mrp:parseFloat(formData.mrp)||0, currentStock:parseInt(formData.currentStock)||0,
    reorderLevel:parseInt(formData.reorderLevel)||5,
    tags:formData.tags?formData.tags.split(",").map(t=>t.trim()).filter(Boolean):[],
    updatedAt:new Date().toISOString(), createdAt:formData.createdAt||new Date().toISOString()
  };
  updateCustomsFromProduct(prod);
  if (state.editing) state.products = state.products.map(p=>p.id===prod.id?prod:p);
  else state.products.push(prod);
  saveProducts();
  state.editing=null; state.addType=null;
  goTab("inventory");
}

async function saveAcc() {
  if (!formData.name?.trim()) { alert("Name is required"); return; }
  if (formData.currentStock===""||formData.currentStock===null) { alert("Current stock is required"); return; }
  const prod = {...formData, id:formData.id||uid(), type:"accessory",
    purchasePrice:parseFloat(formData.purchasePrice)||0, currentStock:parseInt(formData.currentStock)||0,
    reorderLevel:parseInt(formData.reorderLevel)||0, leadTimeDays:parseInt(formData.leadTimeDays)||21,
    updatedAt:new Date().toISOString(), createdAt:formData.createdAt||new Date().toISOString()
  };
  if (state.editing) state.products = state.products.map(p=>p.id===prod.id?prod:p);
  else state.products.push(prod);
  saveProducts();
  state.editing=null; state.addType=null;
  goTab("inventory");
}

function updateCustomsFromProduct(prod) {
  const nc = {...state.customs};
  if (prod.brand) {
    const key=prod.type==="sunglasses"?"sunglass_brands":prod.type==="rx_lens"||prod.type==="colour_lens"||prod.type==="rg_lens"?"lens_brands":"frame_brands";
    if (!nc[key]?.includes(prod.brand)) nc[key]=[...(nc[key]||[]),prod.brand];
  }
  if (prod.supplier&&!nc.suppliers?.includes(prod.supplier)) nc.suppliers=[...(nc.suppliers||[]),prod.supplier];
  if (prod.collection&&!nc.collections?.includes(prod.collection)) nc.collections=[...(nc.collections||[]),prod.collection];
  state.customs = nc;
  saveCustoms();
}

// Edit / Delete
function editProduct(id) {
  const p = state.products.find(x=>x.id===id);
  if (!p) return;
  state.editing = p;
  state.addType = p.type;
  initForm(p, p.type);
  state.tab = "add";
  render();
}

function requestDelete(id) {
  const p = state.products.find(x=>x.id===id);
  if (!p) return;
  state.pinTarget = p;
  state.pinVal = "";
  state.pinErr = false;
  render();
}
function setPinVal(v) { state.pinVal=v; }
function cancelPin() { state.pinTarget=null; state.pinVal=""; state.pinErr=false; render(); }
function checkPin() {
  if (state.pinVal===PIN) {
    state.pinTarget && (state.delTarget=state.pinTarget);
    state.pinTarget=null; state.pinVal=""; state.pinErr=false;
    state.delReason=""; state.showDelModal=true;
    render();
  } else {
    state.pinErr=true; state.pinVal="";
    render();
    setTimeout(()=>{state.pinErr=false;render();},1500);
  }
}
function cancelDel() { state.showDelModal=false; state.delTarget=null; state.delReason=""; render(); }
function execDel() {
  if (!state.delReason) return;
  const p = state.delTarget;
  if (!p) return;
  const si = getStock(p);
  const hasSale = state.sales.some(s=>s.productId===p.id);
  const rec = {...p, deletedAt:new Date().toISOString(), reason:state.delReason, stockAtDeletion:si.total, saleExists:hasSale};
  state.deleted.push(rec);
  saveDeleted();
  state.products = state.products.filter(x=>x.id!==p.id);
  saveProducts();
  state.showDelModal=false; state.delTarget=null; state.delReason="";
  render();
}

// Sell
function startSell(id) { sellState.selectedId=id; const p=state.products.find(x=>x.id===id); if(p) sellState.price=String(p.sellingPrice); state.tab="sell"; render(); }
function setSellSearch(v) { sellState.search=v; render(); }
function selectSellProduct(id) { const p=state.products.find(x=>x.id===id); sellState.selectedId=id; sellState.power=""; sellState.colour=""; if(p) sellState.price=String(p.sellingPrice); render(); }
function clearSellSel() { sellState.selectedId=null; sellState.power=""; sellState.colour=""; render(); }
function setSellField(k,v) { sellState[k]=v; }
function setSellPower(pw) { sellState.power=pw; render(); }
function setSellColour(c) { sellState.colour=c; render(); }

function recordSale() {
  const sel = state.products.find(p=>p.id===sellState.selectedId);
  if (!sel) return alert("Select a product");
  if (!sellState.bill.trim()) return alert("Enter bill/slip number");
  if ((sel.type==="rx_lens"||sel.type==="rg_lens")&&!sellState.power) return alert("Select a power");
  const qty = parseInt(sellState.qty)||1;
  const maxQty = ()=>{
    if(sel.type==="rx_lens"||sel.type==="rg_lens") return sellState.power?(sel.stock?.[sellState.power]||0):0;
    if(sel.type==="frame"||sel.type==="sunglasses") return sellState.colour?(sel.variants?.find(v=>v.color===sellState.colour)?.qty||0):(sel.variants||[]).reduce((a,v)=>a+v.qty,0);
    return sel.currentStock||0;
  };
  if (qty>maxQty()) return alert(`Only ${maxQty()} in stock`);
  const price = parseFloat(sellState.price)||sel.sellingPrice;
  const sale = {id:uid(),productId:sel.id,billNumber:sellState.bill.trim(),qty,amount:price*qty,sellingPrice:price,date:sellState.date,notes:sellState.notes,type:sel.type,power:sellState.power||null,colour:sellState.colour||null};
  state.sales.push(sale);
  saveSales();
  if (sel.type==="rx_lens"||sel.type==="rg_lens") {
    state.products = state.products.map(p=>p.id===sel.id?{...p,stock:{...p.stock,[sellState.power]:(p.stock[sellState.power]||0)-qty}}:p);
  } else if (sel.type==="frame"||sel.type==="sunglasses") {
    const nv=(sel.variants||[]).map(v=>v.color===sellState.colour?{...v,qty:v.qty-qty}:v);
    state.products = state.products.map(p=>p.id===sel.id?{...p,variants:nv,currentStock:nv.reduce((a,v)=>a+v.qty,0)}:p);
  } else {
    state.products = state.products.map(p=>p.id===sel.id?{...p,currentStock:p.currentStock-qty}:p);
  }
  saveProducts();
  sellState = {search:"",selectedId:null,power:"",colour:"",bill:"",qty:"1",price:"",date:today(),notes:""};
  goTab("inventory");
}

// Scan
function startScan() { state.scanStep="intro"; state.scanResult=null; state.scanPreview=null; render(); }
function closeScan() { state.scanStep=null; render(); }
function retakeScan() { state.scanStep="intro"; state.scanResult=null; state.scanPreview=null; render(); }

async function handleScanPhoto(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  const file = files[0];
  state.scanPreview = URL.createObjectURL(file);
  state.scanStep = "scanning";
  render();
  // Show the photo and let user read + fill manually
  state.scanResult = {brand:"",sku:"",size:"",material:"",color:"",collection:"",notes:"",confidence:"manual"};
  state.scanStep = "result";
  render();
}

function applyScan() {
  const r = state.scanResult;
  if (!r) return;
  if (r.brand) formData.brand=r.brand;
  if (r.sku) formData.sku=r.sku;
  if (r.size) formData.size=r.size;
  if (r.material) formData.material=r.material;
  if (r.collection) formData.collection=r.collection;
  if (r.notes) formData.notes=r.notes;
  state.scanStep=null;
  state.flashMsg="✅ Scan complete! Fields pre-filled below.";
  render();
  setTimeout(()=>{state.flashMsg="";render();},4000);
}

// Lists
function setListActive(k) { state.listActive=k; state.listInput=""; render(); }
function setListInput(v) { state.listInput=v; }
function addListItem() {
  const v = state.listInput.trim();
  if (!v) return;
  const cur = state.customs[state.listActive]||[];
  if (cur.includes(v)) { state.listInput=""; render(); return; }
  state.customs = {...state.customs,[state.listActive]:[...cur,v]};
  saveCustoms();
  state.listInput="";
  render();
}
function removeListItem(item) {
  const cur = state.customs[state.listActive]||[];
  state.customs = {...state.customs,[state.listActive]:cur.filter(x=>x!==item)};
  saveCustoms();
  render();
}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
render();
</script>
